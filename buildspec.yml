version: 0.2

# 주의: ECR 좌표를 env.variables 로 두면 CodePipeline/프로젝트의 환경변수 오버라이드가
# 이를 덮어써 옛 리포(us-east-1/879772956301/lms-frontend)로 push되는 문제가 있었음.
# 그래서 오버라이드의 영향을 받지 않도록 ECR 주소를 명령에 직접 박아 넣음.

phases:
  pre_build:
    commands:
      - echo "VITE_API_URL=$VITE_API_URL" > .env
      - cat .env
      - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - docker build -t 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com/user105-front:$IMAGE_TAG .
      - docker tag 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com/user105-front:$IMAGE_TAG 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com/user105-front:latest

  post_build:
    commands:
      - docker push 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com/user105-front:$IMAGE_TAG
      - docker push 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com/user105-front:latest
